name: Verificar projeto
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/notificacoes-sw.test.mjs
      - run: ./backend/mvnw -B -f backend/pom.xml spotless:check verify
