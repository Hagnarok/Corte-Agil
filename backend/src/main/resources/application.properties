spring.application.name=corte-agil
server.port=${PORT:3000}
server.address=${HOST:0.0.0.0}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/corte-agil;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.mvc.async.request-timeout=0
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.web.resources.static-locations=file:./dist/corte-agil/browser/
spring.lifecycle.timeout-per-shutdown-phase=5s
